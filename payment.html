<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOGAMI - Add Money</title>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f6ff; color: #1e293b; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 480px; background: #ffffff; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; height: 40px; }
        .back-btn { background: #e2e8f0; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; color: #334155; text-decoration: none; font-weight: bold; }
        .title { font-size: 16px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .label { font-size: 13px; font-weight: 700; color: #64748b; margin-bottom: 8px; display: block; }
        .amount-input { width: 100%; padding: 14px; font-size: 20px; font-weight: 800; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; outline: none; color: #0f172a; font-family: monospace; }
        .amount-input:focus { border-color: #025922; box-shadow: 0 0 0 3px rgba(2,89,34,0.1); }
        
        .quick-amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
        .quick-btn { background: #e2e8f0; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; color: #334155; cursor: pointer; transition: all 0.2s; }
        .quick-btn:active { background: #025922; color: #fff; transform: scale(0.96); }
        
        .pay-btn { width: 100%; background: #025922; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(2,89,34,0.3); transition: transform 0.1s; letter-spacing: 0.5px; }
        .pay-btn:active { transform: scale(0.98); }
        .pay-btn:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .note { font-size: 11px; color: #64748b; text-align: center; line-height: 1.4; margin-top: 15px; font-weight: 600; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
        .modal-box { background: #ffffff; width: 85%; max-width: 320px; border-radius: 20px; padding: 25px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid #e2e8f0; }
        .icon-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 15px auto; border: 2px solid; }
        .success-bg { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
        .fail-bg { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .modal-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .modal-desc { font-size: 13px; color: #64748b; line-height: 1.4; margin-bottom: 20px; font-weight: 600; }
        .modal-btn { width: 100%; background: #025922; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="app-container" id="mainContainer" style="opacity: 0; transition: opacity 0.3s ease;">
    <div>
        <div class="header">
            <a href="https://gogamiplay.github.io/gogami/dashboard.html" class="back-btn" id="backLink">←</a>
            <div class="title">Wallet Top-Up</div>
            <div style="width: 36px;"></div>
        </div>

        <div class="card">
            <label class="label">Enter Amount (Min ₹1)</label>
            <input type="number" id="paymentAmountField" class="amount-input" placeholder="e.g. 1" value="1">
            
            <div class="quick-amounts">
                <button class="quick-btn" onclick="setAmount(1)">+₹1</button>
                <button class="quick-btn" onclick="setAmount(10)">+₹10</button>
                <button class="quick-btn" onclick="setAmount(100)">+₹100</button>
                <button class="quick-btn" onclick="setAmount(200)">+₹200</button>
                <button class="quick-btn" onclick="setAmount(500)">+₹500</button>
                <button class="quick-btn" onclick="setAmount(1000)">+₹1000</button>
            </div>
        </div>
    </div>

    <div>
        <button class="pay-btn" id="payButton" onclick="startSecurePayment()">Pay via UPI</button>
        <div class="note">🔒 Secure UPI Payment via Razorpay.<br>Balance updates instantly upon completion.</div>
    </div>
</div>

<!-- POPUP MODAL -->
<div class="modal-overlay" id="statusModalPopup">
    <div class="modal-box">
        <div id="modalIconCircle" class="icon-circle success-bg">✓</div>
        <div class="modal-title" id="modalTitleText">Payment Successful!</div>
        <div class="modal-desc" id="modalPopupDesc">Your payment was captured successfully.</div>
        <button class="modal-btn" id="modalActionBtn" onclick="redirectToDashboard()">Go to Dashboard</button>
    </div>
</div>

<script>
    let activeUserid = "";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        activeUserid = urlParams.get('userid') || urlParams.get('uid') || localStorage.getItem('app_user_mobile');
        
        if (activeUserid && activeUserid !== "no-user") {
            localStorage.setItem('app_user_mobile', activeUserid);
            document.getElementById('mainContainer').style.opacity = '1';
        } else {
            document.getElementById('mainContainer').style.opacity = '1';
        }
    };

    function setAmount(val) { 
        document.getElementById('paymentAmountField').value = val; 
    }

    function showPopup(isSuccess, title, desc) {
        const modal = document.getElementById('statusModalPopup');
        const iconCircle = document.getElementById('modalIconCircle');
        const titleText = document.getElementById('modalTitleText');
        const descText = document.getElementById('modalPopupDesc');

        titleText.innerText = title;
        descText.innerText = desc;

        if (isSuccess) {
            iconCircle.className = "icon-circle success-bg";
            iconCircle.innerHTML = "✓";
        } else {
            iconCircle.className = "icon-circle fail-bg";
            iconCircle.innerHTML = "✕";
        }
        modal.style.display = 'flex';
    }

    function redirectToDashboard() {
        window.location.href = 'https://gogamiplay.github.io/gogami/dashboard.html?payment=success';
    }

    function startSecurePayment() {
        const amountInput = parseFloat(document.getElementById('paymentAmountField').value);
        
        // Testing ke liye minimum amount ₹1 rakha gaya hai
        if (!amountInput || amountInput < 1) {
            alert('⚠️ Please enter a valid amount (Minimum ₹1).');
            return;
        }

        const payBtn = document.getElementById('payButton');
        payBtn.disabled = true;
        payBtn.innerText = "Processing...";

        const txnid = "TXN" + Date.now();

        const options = {
            "key": "rzp_live_TQ14NQzpq4l3Fc",
            "amount": amountInput * 100, 
            "currency": "INR",
            "name": "GOGAMI",
            "description": "Wallet Topup",
            "method": { "netbanking": false, "card": false, "wallet": false, "upi": true },
            "prefill": {
                "contact": activeUserid || "9999999999",
                "email": "support@gogamiplay.com"
            },
            "notes": {
                "userid": activeUserid || "guest",
                "txnid": txnid
            },
            "handler": function (response) {
                payBtn.disabled = false;
                payBtn.innerText = "Pay via UPI";
                showPopup(true, "Payment Successful!", `Payment ID: ${response.razorpay_payment_id}`);
                
                setTimeout(() => {
                    redirectToDashboard();
                }, 2000);
            },
            "theme": { "color": "#025922" }
        };

        const rzp = new Razorpay(options);

        rzp.on('payment.failed', function (response) {
            payBtn.disabled = false;
            payBtn.innerText = "Pay via UPI";
            showPopup(false, "Payment Failed", response.error.description || "The transaction could not be completed. Please try again.");
        });

        try {
            rzp.open();
        } catch(e) {
            payBtn.disabled = false;
            payBtn.innerText = "Pay via UPI";
            alert("Could not open gateway. Please try again.");
        }
    }
</script>
</body>
</html>
