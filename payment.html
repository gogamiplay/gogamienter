<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOGAMI - Add Money</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        /* (Aapka styling wahi rahega) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f0f6ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .pay-btn { width: 100%; background: #025922; color: #fff; padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <h3>Add Money to GOGAMI</h3>
    <input type="number" id="amount" class="amount-input" value="200" style="width:100%; padding:15px; margin:20px 0; border:1px solid #ccc; border-radius:10px;">
    <button class="pay-btn" onclick="initiatePayment()">Pay via UPI</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDLZdlEN9SEb6Z4dsuuMGsRNIzVBMwky_c",
        authDomain: "gogami-877be.firebaseapp.com",
        projectId: "gogami-877be",
        storageBucket: "gogami-877be.firebasestorage.app",
        messagingSenderId: "220921167245",
        appId: "1:220921167245:web:3ccc8b424e5bc927c291c4"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // LOGIC: Yahan Auth ka koi redirect nahi hai, isliye loop nahi banega.
    // User jab dashboard se yahan aayega, ye seedha razorpay open karega.
    
    function initiatePayment() {
        const amount = document.getElementById('amount').value;
        const user = auth.currentUser;
        
        // Agar user login nahi hai toh bas alert de do, redirect mat karo
        if (!user) {
            alert("Please login from the main dashboard first.");
            return;
        }

        const options = {
            "key": "rzp_live_TQ14NQzpq4l3Fc", 
            "amount": amount * 100,
            "currency": "INR",
            "name": "GOGAMI",
            "handler": function (response) {
                alert("Payment Successful!");
                window.location.href = "https://gogamiplay.github.io/gogami/dashboard.html";
            },
            "theme": { "color": "#025922" }
        };
        new Razorpay(options).open();
    }
</script>
</body>
</html>
